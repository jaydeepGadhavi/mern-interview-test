<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm backdrop-blur-md bg-white/90">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <a routerLink="/" class="flex items-center gap-2 group">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-100 group-hover:scale-105 transition-transform">
        P
      </div>
      <span class="font-bold text-lg text-slate-900 tracking-tight group-hover:text-indigo-600 transition-colors">
        Product Manager
      </span>
      <span class="text-[10px] font-bold uppercase tracking-wider bg-rose-50 text-rose-600 border border-rose-200 px-2 py-0.5 rounded-full ml-1">
        Angular
      </span>
    </a>

    @if (isLoggedIn()) {
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-100/80 px-3 py-1.5 rounded-full border border-slate-200/60">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-sm font-medium text-slate-700">
            Hi, <span class="font-semibold text-slate-900">{{ currentUser()?.username }}</span>
          </span>
        </div>

        <button
          type="button"
          (click)="onLogout()"
          class="text-sm font-medium text-slate-600 hover:text-rose-600 bg-slate-100 hover:bg-rose-50 border border-slate-200 hover:border-rose-200 px-3.5 py-1.5 rounded-lg transition-all duration-150 cursor-pointer"
        >
          Logout
        </button>
      </div>
    }
  </div>
</header>
