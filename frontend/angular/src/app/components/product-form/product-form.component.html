<div class="bg-white border border-slate-200/80 rounded-2xl p-6 shadow-sm mb-6">
  <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-sm">
        {{ product ? '✏️' : '➕' }}
      </div>
      <div>
        <h3 class="font-bold text-slate-900 text-base">
          {{ product ? 'Edit Product' : 'Add New Product' }}
        </h3>
        <p class="text-xs text-slate-500">
          {{ product ? 'Update product information in MongoDB' : 'Create and save a new product into MongoDB' }}
        </p>
      </div>
    </div>

    @if (product) {
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
        Editing #{{ product.id.slice(-6) }}
      </span>
    }
  </div>

  <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
          Product Name *
        </label>
        <input
          type="text"
          name="name"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
          required
          placeholder="e.g. Wireless Mouse"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-900 text-sm transition-all placeholder:text-slate-400"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
          Price (₹) *
        </label>
        <input
          type="number"
          name="price"
          min="0"
          step="0.01"
          [value]="price()"
          (input)="price.set($any($event.target).value)"
          required
          placeholder="e.g. 499.00"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-900 text-sm transition-all placeholder:text-slate-400"
        />
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
        Description
      </label>
      <textarea
        name="description"
        rows="3"
        [value]="description()"
        (input)="description.set($any($event.target).value)"
        placeholder="Short details about the product..."
        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-900 text-sm transition-all placeholder:text-slate-400"
      ></textarea>
    </div>

    <div class="flex items-center gap-3 pt-2">
      <button
        type="submit"
        [disabled]="!name().trim() || price() === '' || price() === null"
        class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-sm shadow-sm hover:shadow transition-all cursor-pointer flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span>{{ product ? 'Update Product' : 'Add Product' }}</span>
      </button>

      @if (product) {
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold text-sm transition-all cursor-pointer"
        >
          Cancel
        </button>
      }
    </div>
  </form>
</div>
